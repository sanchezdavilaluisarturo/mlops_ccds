<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" width="1020" height="470" role="img" aria-label="Flujo del workflow Entrenamiento en GitHub Actions: se lanza a mano; el job lee los inputs del archivo entrenar.yaml, el secret MLFLOW_TRACKING_URI y la variable MLFLOW_EXPERIMENT_NAME; verifica que MLflow responda y, si no, falla; entrena, registra el run en MLflow y sube la carpeta reports como artifact del workflow.">
  <title>Workflow de entrenamiento en GitHub Actions</title>
  <style>
    .node{fill:#fff;stroke:#16212b;stroke-width:1.4}
    .node.accent{fill:#dcecf2;stroke:#0a6c8f;stroke-width:2}
    .node.store{fill:#f6ead0;stroke:#8a5a00;stroke-width:1.6}
    .node.opt{stroke-dasharray:5 4;stroke:#5b6874}
    .lane{fill:none;stroke:#9aa7b2;stroke-dasharray:3 4}
    .t{fill:#16212b;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:600}
    .s{fill:#5b6874;font-family:Menlo,Consolas,monospace;font-size:11px}
    .l{fill:#16212b;font-family:Menlo,Consolas,monospace;font-size:11px}
    .edge{stroke:#16212b;stroke-width:1.5;fill:none}
    .edge.accent{stroke:#0a6c8f;stroke-width:2}
    .edge.dash{stroke:#9aa7b2;stroke-dasharray:5 4}
    .head{fill:#16212b}
    .head.accent{fill:#0a6c8f}
</style>
  <rect width="1020" height="470" fill="#ffffff"/>
  <g>
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker>
      <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head accent"/></marker>
    </defs>

    <!-- de dónde sale cada valor -->
    <rect class="node accent" x="20" y="40" width="210" height="60" rx="4"/>
    <text class="t" x="125.0" y="62" text-anchor="middle">Lanzamiento manual</text>
    <text class="s" x="125.0" y="79" text-anchor="middle">Actions › Run workflow</text>
    <text class="s" x="125.0" y="94" text-anchor="middle">o gh workflow run -f run_name=…</text>
    <line class="edge accent" x1="230" y1="70" x2="288" y2="70" marker-end="url(#ahc)"/>
    <text class="l" x="259" y="62" text-anchor="middle">dispara</text>

    <rect class="node store" x="20" y="150" width="210" height="60" rx="4"/>
    <text class="t" x="125.0" y="172" text-anchor="middle">Secrets</text>
    <text class="s" x="125.0" y="189" text-anchor="middle">MLFLOW_TRACKING_URI</text>
    <text class="s" x="125.0" y="204" text-anchor="middle">cifrado, no se imprime</text>
    <line class="edge" x1="230" y1="180" x2="288" y2="180" marker-end="url(#ah)"/>
    <text class="l" x="259" y="172" text-anchor="middle">env</text>

    <rect class="node " x="20" y="226" width="210" height="74" rx="4"/>
    <text class="t" x="125.0" y="248" text-anchor="middle">En git</text>
    <text class="s" x="125.0" y="265" text-anchor="middle">entrenar.yaml</text>
    <text class="s" x="125.0" y="280" text-anchor="middle">seed + hiperparámetros</text>
    <text class="s" x="125.0" y="295" text-anchor="middle">(valores por defecto)</text>
    <line class="edge" x1="230" y1="263" x2="288" y2="263" marker-end="url(#ah)"/>
    <text class="l" x="259" y="255" text-anchor="middle">inputs</text>

    <rect class="node store" x="20" y="316" width="210" height="60" rx="4"/>
    <text class="t" x="125.0" y="338" text-anchor="middle">Variables</text>
    <text class="s" x="125.0" y="355" text-anchor="middle">MLFLOW_EXPERIMENT_NAME</text>
    <text class="s" x="125.0" y="370" text-anchor="middle">visible, no secreta</text>
    <line class="edge" x1="230" y1="346" x2="288" y2="346" marker-end="url(#ah)"/>
    <text class="l" x="259" y="338" text-anchor="middle">env</text>

    <!-- runner -->
    <rect class="lane" x="290" y="20" width="470" height="390" rx="6"/>
    <text class="l" x="302" y="37">runner ubuntu-latest · job entrenar</text>
    <rect class="node " x="320" y="50" width="410" height="52" rx="4"/>
    <text class="t" x="525.0" y="72" text-anchor="middle">Checkout</text>
    <text class="s" x="525.0" y="89" text-anchor="middle">actions/checkout@v4</text>
    <rect class="node " x="320" y="118" width="410" height="52" rx="4"/>
    <text class="t" x="525.0" y="140" text-anchor="middle">Python 3.12 y dependencias</text>
    <text class="s" x="525.0" y="157" text-anchor="middle">pip install -r requirements.txt</text>
    <rect class="node " x="320" y="186" width="410" height="52" rx="4"/>
    <text class="t" x="525.0" y="208" text-anchor="middle">Verificar MLflow</text>
    <text class="s" x="525.0" y="225" text-anchor="middle">curl /health · falla si falta el secret o no responde</text>
    <rect class="node accent" x="320" y="254" width="410" height="52" rx="4"/>
    <text class="t" x="525.0" y="276" text-anchor="middle">Entrenar</text>
    <text class="s" x="525.0" y="293" text-anchor="middle">train.py con los inputs · run_name elegido</text>
    <rect class="node " x="320" y="322" width="410" height="52" rx="4"/>
    <text class="t" x="525.0" y="344" text-anchor="middle">Guardar reports/</text>
    <text class="s" x="525.0" y="361" text-anchor="middle">actions/upload-artifact@v4</text>
    <line class="edge" x1="525" y1="102" x2="525" y2="116" marker-end="url(#ah)"/>
    <line class="edge" x1="525" y1="170" x2="525" y2="184" marker-end="url(#ah)"/>
    <line class="edge" x1="525" y1="238" x2="525" y2="252" marker-end="url(#ah)"/>
    <line class="edge" x1="525" y1="306" x2="525" y2="320" marker-end="url(#ah)"/>

    <!-- salidas -->
    <rect class="node opt" x="800" y="180" width="200" height="50" rx="4"/>
    <text class="t" x="900.0" y="202" text-anchor="middle">Job en rojo</text>
    <text class="s" x="900.0" y="219" text-anchor="middle">sin secret o MLflow caído</text>
    <line class="edge dash" x1="730" y1="212" x2="798" y2="208" marker-end="url(#ah)"/>
    <text class="l" x="764" y="198" text-anchor="middle">si falla</text>

    <rect class="node accent" x="800" y="244" width="200" height="68" rx="4"/>
    <text class="t" x="900.0" y="266" text-anchor="middle">MLflow Tracking Server</text>
    <text class="s" x="900.0" y="283" text-anchor="middle">URL pública (ngrok)</text>
    <text class="s" x="900.0" y="298" text-anchor="middle">guarda en PostgreSQL y MinIO</text>
    <line class="edge accent" x1="730" y1="280" x2="798" y2="278" marker-end="url(#ahc)"/>
    <text class="l" x="764" y="270" text-anchor="middle">registra</text>

    <rect class="node " x="800" y="332" width="200" height="60" rx="4"/>
    <text class="t" x="900.0" y="354" text-anchor="middle">Artifact del workflow</text>
    <text class="s" x="900.0" y="371" text-anchor="middle">reports-&lt;n&gt;</text>
    <text class="s" x="900.0" y="386" text-anchor="middle">métricas y gráficas</text>
    <line class="edge" x1="730" y1="348" x2="798" y2="360" marker-end="url(#ah)"/>
    <text class="l" x="764" y="340" text-anchor="middle">sube</text>

    <!-- leyenda -->
    <line class="edge" x1="20" y1="440" x2="54" y2="440" marker-end="url(#ah)"/>
    <text class="l" x="64" y="444">flujo normal</text>
    <line class="edge dash" x1="190" y1="440" x2="224" y2="440" marker-end="url(#ah)"/>
    <text class="l" x="234" y="444">ruta de fallo</text>
  </g>
</svg>
