<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 490" width="1020" height="490" role="img" aria-label="Flujo de train.py: el CSV crudo se limpia, se parte con la semilla, se entrena, se elige el umbral en validación y se evalúa en Test. Las métricas se guardan en reports/ y el run se registra en el servidor MLflow, que guarda metadatos en PostgreSQL y artefactos en MinIO.">
  <title>Flujo de entrenamiento de churn</title>
  <style>
    .node{fill:#fff;stroke:#16212b;stroke-width:1.4}
    .node.accent{fill:#dcecf2;stroke:#0a6c8f;stroke-width:2}
    .node.store{fill:#f6ead0;stroke:#8a5a00;stroke-width:1.6}
    .node.opt{stroke-dasharray:5 4;stroke:#5b6874}
    .lane{fill:none;stroke:#9aa7b2;stroke-dasharray:3 4}
    .t{fill:#16212b;font-family:Helvetica,Arial,sans-serif;font-size:13px;font-weight:600}
    .s{fill:#5b6874;font-family:Menlo,Consolas,monospace;font-size:11px}
    .l{fill:#16212b;font-family:Menlo,Consolas,monospace;font-size:11px}
    .edge{stroke:#16212b;stroke-width:1.5;fill:none}
    .edge.accent{stroke:#0a6c8f;stroke-width:2}
    .edge.dash{stroke:#9aa7b2;stroke-dasharray:5 4}
    .head{fill:#16212b}
    .head.accent{fill:#0a6c8f}
</style>
  <rect width="1020" height="490" fill="#ffffff"/>
  <g>
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head"/></marker>
      <marker id="ahc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="head accent"/></marker>
    </defs>

    <!-- argumentos CLI -->
    <rect class="node accent" x="356" y="22" width="308" height="56" rx="4"/>
    <text class="t" x="510.0" y="48" text-anchor="middle">Argumentos de línea de comandos</text>
    <text class="s" x="510.0" y="66" text-anchor="middle">--seed · --learning-rate · --max-depth …</text>
    <path class="edge accent" d="M430 78 L430 148" marker-end="url(#ahc)"/>
    <text class="l" x="440" y="116">seed</text>
    <path class="edge accent" d="M590 78 L590 148" marker-end="url(#ahc)"/>
    <text class="l" x="600" y="116">hiperparámetros</text>

    <!-- una ejecución de train.py -->
    <rect class="lane" x="176" y="120" width="836" height="116" rx="6"/>
    <text class="l" x="188" y="137">una ejecución de train.py</text>

    <!-- fila principal -->
    <rect class="node " x="20" y="150" width="140" height="70" rx="4"/>
    <text class="t" x="90.0" y="176" text-anchor="middle">CSV crudo</text>
    <text class="s" x="90.0" y="194" text-anchor="middle">data/raw/</text>
    <text class="s" x="90.0" y="209" text-anchor="middle">churn-bigml-80.csv</text>
    <rect class="node " x="188" y="150" width="140" height="70" rx="4"/>
    <text class="t" x="258.0" y="176" text-anchor="middle">Limpieza</text>
    <text class="s" x="258.0" y="194" text-anchor="middle">dataset.py</text>
    <text class="s" x="258.0" y="209" text-anchor="middle">clean_data</text>
    <rect class="node " x="356" y="150" width="140" height="70" rx="4"/>
    <text class="t" x="426.0" y="176" text-anchor="middle">Partición</text>
    <text class="s" x="426.0" y="194" text-anchor="middle">features.py</text>
    <text class="s" x="426.0" y="209" text-anchor="middle">split_data 70/15/15</text>
    <rect class="node " x="524" y="150" width="140" height="70" rx="4"/>
    <text class="t" x="594.0" y="176" text-anchor="middle">Entrenamiento</text>
    <text class="s" x="594.0" y="194" text-anchor="middle">fit_model</text>
    <text class="s" x="594.0" y="209" text-anchor="middle">--tune: GridSearch</text>
    <rect class="node " x="692" y="150" width="140" height="70" rx="4"/>
    <text class="t" x="762.0" y="176" text-anchor="middle">Umbral</text>
    <text class="s" x="762.0" y="194" text-anchor="middle">select_threshold</text>
    <text class="s" x="762.0" y="209" text-anchor="middle">máx. F1 en Val</text>
    <rect class="node " x="860" y="150" width="140" height="70" rx="4"/>
    <text class="t" x="930.0" y="176" text-anchor="middle">Evaluación</text>
    <text class="s" x="930.0" y="194" text-anchor="middle">evaluate_model</text>
    <text class="s" x="930.0" y="209" text-anchor="middle">métricas en Test</text>

    <line class="edge" x1="160" y1="185" x2="186" y2="185" marker-end="url(#ah)"/>
    <line class="edge" x1="328" y1="185" x2="354" y2="185" marker-end="url(#ah)"/>
    <line class="edge" x1="496" y1="185" x2="522" y2="185" marker-end="url(#ah)"/>
    <line class="edge" x1="664" y1="185" x2="690" y2="185" marker-end="url(#ah)"/>
    <line class="edge" x1="832" y1="185" x2="858" y2="185" marker-end="url(#ah)"/>

    <!-- pasos opcionales que guardan archivos -->
    <rect class="node opt" x="188" y="290" width="308" height="56" rx="4"/>
    <text class="t" x="342.0" y="316" text-anchor="middle">data/processed/</text>
    <text class="s" x="342.0" y="334" text-anchor="middle">churn_clean.csv · train/val/test.csv</text>
    <path class="edge dash" d="M258 220 L258 288" marker-end="url(#ah)"/>
    <text class="l" x="268" y="262">guarda</text>
    <path class="edge dash" d="M426 220 L426 288" marker-end="url(#ah)"/>
    <text class="l" x="436" y="262">guarda</text>

    <!-- salidas -->
    <rect class="node " x="560" y="290" width="190" height="66" rx="4"/>
    <text class="t" x="655.0" y="316" text-anchor="middle">reports/</text>
    <text class="s" x="655.0" y="334" text-anchor="middle">metrics_&lt;run&gt;.json</text>
    <text class="s" x="655.0" y="349" text-anchor="middle">run_notes · figuras</text>
    <path class="edge" d="M880 220 C880 250 655 250 655 288" marker-end="url(#ah)"/>
    <text class="l" x="645" y="276" text-anchor="end">escribe archivos</text>

    <rect class="node accent" x="790" y="290" width="210" height="66" rx="4"/>
    <text class="t" x="895.0" y="316" text-anchor="middle">MLflow Tracking Server</text>
    <text class="s" x="895.0" y="334" text-anchor="middle">localhost:5002</text>
    <text class="s" x="895.0" y="349" text-anchor="middle">--serve-artifacts</text>
    <path class="edge accent" d="M930 220 L930 288" marker-end="url(#ahc)"/>
    <text class="l" x="922" y="268" text-anchor="end">log_params · log_metrics</text>
    <text class="l" x="922" y="283" text-anchor="end">log_artifact · log_model</text>

    <rect class="node store" x="710" y="420" width="150" height="56" rx="4"/>
    <text class="t" x="785.0" y="446" text-anchor="middle">PostgreSQL</text>
    <text class="s" x="785.0" y="464" text-anchor="middle">params · métricas</text>
    <rect class="node store" x="870" y="420" width="140" height="56" rx="4"/>
    <text class="t" x="940.0" y="446" text-anchor="middle">MinIO</text>
    <text class="s" x="940.0" y="464" text-anchor="middle">modelo · gráficas</text>
    <path class="edge" d="M860 356 C860 392 785 384 785 418" marker-end="url(#ah)"/>
    <path class="edge" d="M940 356 L940 418" marker-end="url(#ah)"/>

    <rect class="node accent" x="520" y="420" width="170" height="56" rx="4"/>
    <text class="t" x="605.0" y="446" text-anchor="middle">MLflow UI</text>
    <text class="s" x="605.0" y="464" text-anchor="middle">Compare runs</text>
    <path class="edge" d="M800 356 C800 388 605 388 605 418" marker-end="url(#ah)"/>
    <text class="l" x="700" y="405" text-anchor="middle">lee y compara</text>

    <!-- leyenda -->
    <line class="edge" x1="20" y1="446" x2="54" y2="446" marker-end="url(#ah)"/>
    <text class="l" x="64" y="450">flujo dentro de train.py</text>
    <line class="edge dash" x1="20" y1="468" x2="54" y2="468" marker-end="url(#ah)"/>
    <text class="l" x="64" y="472">paso opcional: python -m mlops_ccds.dataset / .features</text>
  </g>
</svg>
